name: Full Pipeline QA
description: >-
  Generate and review functional, negative, security, API, and exploratory
  test scenarios, consolidate coverage, run a Three Amigos review, and pause
  for human approval with any unresolved disagreements explicitly identified.
entry: requirements_loader

templates:
  - id: qa_agent
    type: standard
    runtime: codex
    retry: {count: 2, backoff: 2s}

  - id: test_plan_agent
    extends: qa_agent
    output:
      schema: qa-test-plan
      on_invalid: repair
      max_repairs: 2

  # Prompts are replaced, not appended, by extends. Each gate keeps its
  # complete category-specific review criteria below.
  - id: planner_gate
    type: llm_gate
    runtime: codex
    retry: {count: 2, backoff: 2s}
    additional-input: [requirements_loader]
    max_reworks: 2

  # Session retries belong to the session, not its participants.
  - id: amigo
    type: standard
    runtime: codex

agents:
  - id: requirements_loader
    extends: qa_agent
    description: Requirements Loader
    prompt: |
      You are a test requirements analyst.

      If story content is present, analyze it directly and skip Jira retrieval.
      Treat any plain-language feature or behavior description as story content.
      Otherwise, if given a Jira ID, retrieve the story and available acceptance
      criteria, linked defects, linked stories, comments and attachments using
      available tools. If retrieval is unavailable or fails, report that explicitly;
      do not claim to have retrieved content or invent it.
      Ask for input only when neither usable story content nor a retrievable
      Jira story is available. Never ask for content already provided.

      Produce a requirements summary with:
      - Explicit requirements with stable IDs REQ-001, REQ-002, etc.
      - Business objectives, actors and critical workflows
      - Stated validation rules, security concerns and API interactions
      - Risks tied to requirement IDs
      - Proposed assumptions, clearly labeled as unconfirmed
      - Open questions and unavailable supporting information

      Keep facts separate from assumptions. Do not invent acceptance criteria,
      endpoints, limits, browser support or historical defects. Missing details
      do not prevent planning; identify them as open questions.
    handoff: [qa_coordinator]

  - id: qa_coordinator
    type: orchestrator
    description: Coordinates parallel test planning and category reviews.
    stages:
      - id: planning
        agents:
          - functional_planner_a
          - functional_planner_b
          - negative_planner_a
          - negative_planner_b
          - security_planner_a
          - security_planner_b
          - api_planner_a
          - api_planner_b
          - exploratory_planner_a
          - exploratory_planner_b
    handoff: [master_judge]

  - id: functional_planner_a
    extends: test_plan_agent
    description: Functional Flow Planner
    prompt: |
      Create functional tests for happy paths, core workflows, multi-step user
      journeys and end-to-end processes supported by the requirements.
      Use IDs FUNC-A-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent behavior or duplicate tests. Record unsupported areas in
      exclusions with reasons, and missing details in open_questions.
    handoff: [functional_planner_a_gate]

  - id: functional_planner_a_gate
    extends: planner_gate
    description: Functional Flow Gate
    reject-to: functional_planner_a
    prompt: |
      Review the functional flow test plan against the supplied requirements.
      Approve only if applicable happy paths, core workflows, multi-step journeys
      and end-to-end processes are meaningfully covered. Check that REQ references
      are real, outcomes are supported, steps are actionable, priorities are
      sensible, and tests are not duplicates. Justified exclusions are valid;
      missing information must be explicit, not invented.
      Otherwise reject with specific, actionable corrections.
    handoff: [functional_judge]

  - id: functional_planner_b
    extends: test_plan_agent
    description: Business Rules Planner
    prompt: |
      Create functional tests for business rules, validation logic, state
      transitions and workflow branching supported by the requirements.
      Use IDs FUNC-B-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent rules or duplicate tests. Record unsupported areas in
      exclusions with reasons, and missing details in open_questions.
    handoff: [functional_planner_b_gate]

  - id: functional_planner_b_gate
    extends: planner_gate
    description: Business Rules Gate
    reject-to: functional_planner_b
    prompt: |
      Review the business rules test plan against the supplied requirements.
      Approve only if applicable business rules, validation logic, state
      transitions and workflow branching are meaningfully covered. Check real
      REQ references, supported outcomes, actionable steps, sensible priorities
      and no duplicate tests. Accept justified exclusions; do not require
      invented rules. Otherwise reject with specific, actionable corrections.
    handoff: [functional_judge]

  # Approved gates pass through both the plan and their requirements context.
  # Judges use that context rather than appending another requirements copy.
  - id: functional_judge
    extends: test_plan_agent
    description: Functional Judge
    prompt: |
      Consolidate both functional plans using the supplied requirements.
      Preserve distinct journeys, business rules and REQ references, merge
      equivalent tests, and remove unsupported or weak tests. Return a single
      schema-conforming plan with actionable tests, justified exclusions,
      coverage gaps and open questions. Explain removed coverage in coverage_gaps
      when relevant. Never treat an unconfirmed assumption as a requirement.

  - id: negative_planner_a
    extends: test_plan_agent
    description: Negative Input Planner
    prompt: |
      Create negative tests for invalid inputs, empty values, boundaries,
      invalid formats and mandatory fields supported by the requirements.
      Use IDs NEG-A-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent limits or duplicate tests. Record unsupported areas in
      exclusions with reasons, and missing details in open_questions.
    handoff: [negative_planner_a_gate]

  - id: negative_planner_a_gate
    extends: planner_gate
    description: Negative Input Gate
    reject-to: negative_planner_a
    prompt: |
      Review the negative input plan against the supplied requirements.
      Approve only if applicable invalid inputs, empty values, boundaries,
      formats and mandatory field failures are meaningfully covered. Check real
      REQ references, supported outcomes, actionable steps, sensible priorities
      and no duplicate tests. Accept justified exclusions and questions about
      unspecified limits. Otherwise reject with specific, actionable corrections.
    handoff: [negative_judge]

  - id: negative_planner_b
    extends: test_plan_agent
    description: Failure Mode Planner
    prompt: |
      Create negative tests for service failures, timeouts, dependency errors,
      browser issues, interrupted workflows and recovery where supported.
      Use IDs NEG-B-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent dependencies, browser support or recovery guarantees.
      Avoid duplicates. Record unsupported areas in exclusions with reasons,
      and missing details in open_questions.
    handoff: [negative_planner_b_gate]

  - id: negative_planner_b_gate
    extends: planner_gate
    description: Failure Mode Gate
    reject-to: negative_planner_b
    prompt: |
      Review the failure mode plan against the supplied requirements.
      Approve only if applicable failures, timeouts, dependencies, browser issues,
      interruptions and recovery are meaningfully covered. Check real REQ
      references, supported outcomes, actionable steps, sensible priorities and
      no duplicates. Accept justified exclusions; do not demand browser or
      service tests for absent features. Otherwise reject with actionable fixes.
    handoff: [negative_judge]

  - id: negative_judge
    extends: test_plan_agent
    description: Negative Judge
    prompt: |
      Consolidate both negative plans against the supplied requirements.
      Assess error handling, failure paths and recovery where applicable.
      Merge duplicates, remove unsupported tests and preserve distinct coverage
      and REQ references. Return a single schema-conforming plan with actionable
      tests, justified exclusions, coverage gaps and open questions.

  - id: security_planner_a
    extends: test_plan_agent
    description: OWASP Planner
    prompt: |
      Create security tests for relevant OWASP categories, authentication,
      authorization, sessions and input validation supported by the requirements.
      Use IDs SEC-A-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent security features or duplicate tests. Record unsupported
      areas in exclusions with reasons, and missing details in open_questions.
    handoff: [security_planner_a_gate]

  - id: security_planner_a_gate
    extends: planner_gate
    description: OWASP Gate
    reject-to: security_planner_a
    prompt: |
      Review the OWASP plan against the supplied requirements.
      Approve only if relevant OWASP categories, authentication, authorization,
      sessions and input validation are meaningfully covered where applicable.
      Check real REQ references, supported outcomes, actionable steps, sensible
      priorities and no duplicates. Accept justified exclusions and explicit
      security questions; do not invent features. Otherwise reject with fixes.
    handoff: [security_judge]

  - id: security_planner_b
    extends: test_plan_agent
    description: Abuse Case Planner
    prompt: |
      Create security tests for privilege escalation, data leakage, enumeration,
      abuse cases and injection risks grounded in the requirements.
      Use IDs SEC-B-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent attack surfaces or duplicate tests. Record unsupported areas
      in exclusions with reasons, and missing details in open_questions.
    handoff: [security_planner_b_gate]

  - id: security_planner_b_gate
    extends: planner_gate
    description: Abuse Case Gate
    reject-to: security_planner_b
    prompt: |
      Review the abuse case plan against the supplied requirements.
      Approve only if applicable escalation, leakage, enumeration, abuse and
      injection risks are meaningfully covered. Check real REQ references,
      supported outcomes, actionable steps, sensible priorities and no duplicates.
      Accept justified exclusions; do not demand absent attack surfaces.
      Otherwise reject with specific, actionable corrections.
    handoff: [security_judge]

  - id: security_judge
    extends: test_plan_agent
    description: Security Judge
    prompt: |
      Consolidate both security plans against the supplied requirements.
      Assess authentication, authorization, auditing, sessions and data protection
      where applicable. Merge duplicates, remove weak or unsupported tests, and
      preserve distinct risks and REQ references. Return a single schema-conforming
      plan with actionable tests, justified exclusions, gaps and open questions.

  - id: api_planner_a
    extends: test_plan_agent
    description: API Contract Planner
    prompt: |
      Create API tests for documented contracts, request and response schemas,
      status codes and validation rules supported by the requirements.
      Use IDs API-A-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent endpoints, schemas or status codes. Avoid duplicates.
      If no API aspects apply, return empty tests and a justified exclusion.
      Record other unsupported areas in exclusions and missing details in
      open_questions.
    handoff: [api_planner_a_gate]

  - id: api_planner_a_gate
    extends: planner_gate
    description: API Contract Gate
    reject-to: api_planner_a
    prompt: |
      Review the API contract plan against the supplied requirements.
      Approve meaningful applicable contract, schema, status and validation
      coverage, or an empty test list with a justified no-API exclusion.
      Check real REQ references, supported outcomes, actionable steps, sensible
      priorities and no duplicates. Do not require invented contracts.
      Otherwise reject with specific, actionable corrections.
    handoff: [api_judge]

  - id: api_planner_b
    extends: test_plan_agent
    description: API Integration Planner
    prompt: |
      Create API tests for service integration, events, transactions,
      consumer/provider behavior and error propagation supported by requirements.
      Use IDs API-B-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, expected outcomes and priorities.
      Do not invent integrations or duplicate tests. If no integration aspects
      apply, return empty tests and a justified exclusion. Record other
      unsupported areas in exclusions and missing details in open_questions.
    handoff: [api_planner_b_gate]

  - id: api_planner_b_gate
    extends: planner_gate
    description: API Integration Gate
    reject-to: api_planner_b
    prompt: |
      Review the API integration plan against the supplied requirements.
      Approve meaningful applicable integration, event, transaction,
      consumer/provider and error propagation coverage, or an empty test list
      with a justified exclusion. Check real REQ references, supported outcomes,
      actionable steps, sensible priorities and no duplicates. Do not demand
      invented integrations. Otherwise reject with actionable corrections.
    handoff: [api_judge]

  - id: api_judge
    extends: test_plan_agent
    description: API Judge
    prompt: |
      Consolidate both API plans against the supplied requirements.
      Assess applicable contract, integration and reliability coverage.
      Merge duplicates, remove unsupported tests and preserve distinct coverage
      and REQ references. Preserve justified no-API exclusions instead of
      manufacturing tests. Return a single schema-conforming plan with
      actionable tests, justified exclusions, gaps and open questions.

  - id: exploratory_planner_a
    extends: test_plan_agent
    description: Risk Exploration Planner
    prompt: |
      Create exploratory tests using risk-based testing, SFDPOT, CRUD,
      user journeys and test tours where relevant to the requirements.
      Use IDs EXP-A-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, observable expected outcomes
      and priorities. Do not invent behavior or duplicate tests. Record
      unsupported areas in exclusions and missing details in open_questions.
    handoff: [exploratory_planner_a_gate]

  - id: exploratory_planner_a_gate
    extends: planner_gate
    description: Risk Exploration Gate
    reject-to: exploratory_planner_a
    prompt: |
      Review the risk exploration plan against the supplied requirements.
      Approve meaningful risk-based exploration using SFDPOT, CRUD, journeys
      and tours where relevant, not mandatory examples of every technique.
      Check real REQ references, observable supported outcomes, actionable steps,
      sensible priorities and no duplicates. Accept justified exclusions.
      Otherwise reject with specific, actionable corrections.
    handoff: [exploratory_judge]

  - id: exploratory_planner_b
    extends: test_plan_agent
    description: Unknown Unknowns Planner
    prompt: |
      Create exploratory tests for unexpected behavior, complex workflows,
      human misuse, edge workflows and documented historical defect patterns.
      Use IDs EXP-B-001, etc., and cite REQ IDs for every test.
      Include actionable steps, preconditions, observable expected outcomes
      and priorities. Distinguish risk hypotheses from known defects; do not
      invent defect history or duplicate tests. Record unsupported areas in
      exclusions and missing details in open_questions.
    handoff: [exploratory_planner_b_gate]

  - id: exploratory_planner_b_gate
    extends: planner_gate
    description: Unknown Unknowns Gate
    reject-to: exploratory_planner_b
    prompt: |
      Review the edge exploration plan against the supplied requirements.
      Approve meaningful applicable unexpected behavior, complex workflows,
      misuse and edge coverage. Historical patterns require supplied evidence,
      not invented defects. Check real REQ references, observable supported
      outcomes, actionable steps, sensible priorities and no duplicates.
      Accept justified exclusions. Otherwise reject with actionable corrections.
    handoff: [exploratory_judge]

  - id: exploratory_judge
    extends: test_plan_agent
    description: Exploratory Judge
    prompt: |
      Consolidate both exploratory plans against the supplied requirements.
      Prioritize novel, high-risk, high-value exploration. Merge duplicates,
      remove unsupported tests and preserve distinct coverage and REQ references.
      Return a single schema-conforming plan with actionable tests, justified
      exclusions, coverage gaps and open questions. Do not invent defect history.

  - id: master_judge
    extends: qa_agent
    description: Consolidates the category plans into a draft for Three Amigos review.
    additional-input: [requirements_loader]
    format: true
    prompt: |
      Consolidate the functional, negative, security, API and exploratory plans
      against the original requirements. Merge equivalent tests globally without
      losing distinct steps, outcomes or requirement coverage. Preserve stable
      test IDs where possible and cite all covered REQ IDs on merged tests.
      Remove unsupported tests and preserve justified exclusions.

      Present only these Markdown sections:
      ## Coverage Summary
      Describe each category and requirement coverage qualitatively; distinguish
      covered, partial, missing and not applicable. Do not invent coverage scores.
      ## Coverage Gaps
      Include justified exclusions and missing requirement details.
      ## Risk Areas
      ## Prioritized Tests
      List every retained test separately with ID, category, REQ references,
      scenario, preconditions, steps, expected outcome and priority.
      ## Open Questions

      Preserve consolidated tests, priorities and findings. Do not report
      reduction counts, consolidation counts or test-family counts.
      No automation or Playwright generation is permitted.
    handoff: [three_amigos]

  - id: three_amigos
    type: session
    description: Business, Developer and QA review the draft in up to two rounds.
    additional-input: [requirements_loader]
    retry: {count: 2, backoff: 2s}
    participants: [business_amigo, developer_amigo, qa_amigo]
    turn_order: round_robin
    max_rounds: 2
    summary_agent: qa_amigo
    consensus:
      method: vote
      keyword: "VOTE: AGREE"
      require: all
    handoff:
      - to: review_presenter
        condition: on_consensus
        input: |
          THREE AMIGOS OUTCOME: CONSENSUS

          Draft and requirements reviewed:
          {{ input }}

          Review findings and agreed corrections:
          {{ output }}
      - to: review_presenter
        condition: on_no_consensus
        input: |
          THREE AMIGOS OUTCOME: NO CONSENSUS - HUMAN DECISION REQUIRED

          Draft and requirements reviewed:
          {{ input }}

          Review findings, proposed corrections and unresolved disagreements:
          {{ output }}

  - id: business_amigo
    extends: amigo
    description: Business perspective on intent, acceptance criteria and scope.
    prompt: |
      You are the Business/Product member of the Three Amigos QA review.
      Challenge whether the draft tests reflect business intent, acceptance
      criteria, user value and priorities. Check REQ references and distinguish
      explicit facts from unconfirmed assumptions. Do not invent requirements.
      Review independently from your role before responding to other judges;
      do not agree merely because another participant agrees.
      Keep findings concise and reference test IDs and REQ IDs. Propose precise
      corrections, not a rewrite of the full plan. Reassess unresolved concerns
      each round. Vote only when the draft plus explicitly agreed corrections
      resolves your blocking concerns. Otherwise state blockers without voting.
      No automation or Playwright generation is permitted.

  - id: developer_amigo
    extends: amigo
    description: Developer perspective on feasibility and observable behavior.
    prompt: |
      You are the Developer member of the Three Amigos QA review.
      Challenge technical plausibility, observable outcomes, integration
      assumptions, failure handling and recovery expectations. Require evidence
      for claimed endpoints, limits and guarantees; do not invent implementation.
      Review independently from your role before responding to other judges;
      do not agree merely because another participant agrees.
      Keep findings concise and reference test IDs and REQ IDs. Propose precise
      corrections, not a rewrite of the full plan. Reassess unresolved concerns
      each round. Vote only when the draft plus explicitly agreed corrections
      resolves your blocking concerns. Otherwise state blockers without voting.
      No automation or Playwright generation is permitted.

  - id: qa_amigo
    extends: amigo
    description: QA perspective on coverage and actionability; records the review.
    prompt: |
      You are the QA member of the Three Amigos QA review.
      Challenge actionable steps, preconditions, observable expected outcomes,
      risk priorities, duplication and missing requirement coverage.
      Review independently from your role before responding to other judges;
      do not agree merely because another participant agrees.
      Keep findings concise and reference test IDs and REQ IDs. Propose precise
      corrections, not a rewrite of the full plan. Reassess unresolved concerns
      each round. Vote only when the draft plus explicitly agreed corrections
      resolves your blocking concerns. Otherwise state blockers without voting.

      When asked for the final summary, record the review only: agreed
      corrections by test/REQ ID, proposed but unagreed corrections, unresolved
      disagreements, and open questions. Preserve dissent and distinguish
      unanimous agreement from individual suggestions. Do not introduce new
      corrections after voting or rewrite or drop tests in the summary.
      No automation or Playwright generation is permitted.

  - id: review_presenter
    extends: qa_agent
    description: Applies agreed corrections and presents the full plan and review outcome.
    format: true
    prompt: |
      Produce the final human-review plan from the supplied draft, original
      requirements and Three Amigos findings. Apply only explicitly agreed
      corrections. Preserve all retained test details, IDs, REQ references,
      priorities and justified exclusions. Do not silently drop tests or invent
      behavior. Keep proposed but unagreed changes visible for human decision.

      Present these Markdown sections:
      ## Review Outcome
      Repeat the supplied THREE AMIGOS OUTCOME exactly. If NO CONSENSUS, clearly
      state that human resolution is required; never claim unanimous approval.
      ## Unresolved Disagreements
      Preserve blockers, dissent, affected test/REQ IDs and decisions needed.
      ## Coverage Summary
      Distinguish covered, partial, missing and not applicable without invented scores.
      ## Coverage Gaps
      ## Risk Areas
      ## Prioritized Tests
      List every retained test separately with ID, category, REQ references,
      scenario, preconditions, steps, expected outcome and priority.
      ## Open Questions

      Do not report reduction, consolidation or test-family counts.
      No automation or Playwright generation is permitted.
    handoff: [human_review]

  - id: revise_review_plan
    extends: qa_agent
    description: Revises the latest human-reviewed plan before another Three Amigos review.
    additional-input: [requirements_loader]
    format: true
    prompt: |
      Revise the supplied latest human-reviewed test plan using the rejection
      notes and original requirements. Preserve previous accepted corrections,
      test details, IDs and REQ references. Address substantive feedback, not
      just formatting. Clearly identify unsupported or unresolved requests.
      Previous review outcomes are historical: this revision is a draft awaiting
      a fresh Three Amigos review, not an already agreed plan.
      No automation or Playwright generation is permitted.
    handoff: [three_amigos]

  - id: human_review
    type: approval
    reject-to: revise_review_plan
    format: true
    description: >-
      Review coverage, gaps, risks, prioritized tests and open questions.
      Resolve any Three Amigos disagreements before approving. Approve to
      finish, or reject with actionable feedback to revise the latest plan
      and repeat Three Amigos review in this execution without rerunning
      specialist planning. No automation or Playwright generation is permitted.
