# SignalBox project configuration.
version: 1
project: testproject

# Directory containing pipeline YAML files.
pipelines_dir: pipelines

# Directory where execution history is stored.
state_dir: .signalbox

# Maximum number of terminal executions to retain (0 keeps history forever).
execution_retention: 1000

server:
  host: 127.0.0.1
  port: 8484

# Runtimes map agent "runtime" names to AI backends.
# Types: openai (OpenAI-compatible API), codex, claude, copilot (local agent
# CLIs), cli (any custom command), mock (deterministic echo for demos/tests).
runtimes:
  mock:
    type: mock

  # openai:
  #   type: openai
  #   model: gpt-4o
  #   api_key_env: OPENAI_API_KEY   # key is read from this env var
  #   # base_url: https://api.openai.com/v1   # any OpenAI-compatible endpoint

  # claude:
  #   type: claude                  # runs: claude -p "<prompt>"
  #   # command: claude
  #   # args: ["-p"]
  #   # timeout_seconds: 600

  codex:
     type: codex                   # runs: codex exec "<prompt>"

  # copilot:
  #   type: copilot                 # runs: copilot -p "<prompt>"

  # custom:
  #   type: cli
  #   command: my-agent
  #   args: ["--quiet"]
  #   prompt_mode: stdin            # "arg" (default) or "stdin"
  #   model_arg: --model            # lets agents set model: (codex/claude/copilot use --model)

# Imports may only reference files inside the project directory unless this is
# set to true.
# allow_external_imports: false

# Pipeline registry: a directory (or file share) of versioned, hash-verified
# pipeline packages. Browse it on the Registry page or with
# `signalbox registry search|show|install|publish`. The demo registry holds
# release-notes 1.0.0 and 1.1.0; install one, then upgrade to see the lock
# file (signalbox.lock.json) track it. Paths may be relative, absolute, or
# file:// (e.g. file:///S:/team/signalbox-registry).
registry:
  path: ./registry

# MCP pass-through (opt-in). Agents list the servers they need under `mcp:`
# in a pipeline; only servers registered here, and only the tools listed under
# `tools`, can be granted. SignalBox hands the granted servers to the agent CLI
# (codex, claude, or copilot) for that one call; the tools run as the user
# running SignalBox. Secrets are never written here: env_from maps the
# server's environment variable to one read from SignalBox's environment.
# Demo: pipelines/repo-explorer-mcp.yaml (needs Node.js for npx).
mcp:
  enabled: true
  servers:
    files:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "--read-only", "."]
      tools: [list_directory, directory_tree, read_text_file, get_file_info, search_files]
    # github:
    #   command: github-mcp-server
    #   args: ["stdio"]
    #   env_from:
    #     GITHUB_PERSONAL_ACCESS_TOKEN: GITHUB_TOKEN   # server var: SignalBox var
    #   tools: [search_issues, get_issue]
