    <div><b>Restarted</b> from ${from} at ${what}${r.resumed ? ' (session resumed)' : ''}
    · ${r.reused_runs || 0} completed ${r.reused_runs === 1 ? 'run' : 'runs'} reused${r.forced ? ' · <b>forced on a changed definition</b>' : ''}</div>
    ${warnings ? `<ul class="recovery-warnings">${warnings}</ul>` : ''}</div>`;
}

async function decide(execId, runId, approved) {
  const comment = (document.getElementById('comment-' + runId) || {}).value || '';
  try {
    await api(`/executions/${encodeURIComponent(execId)}/approve`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({run_id: runId, approved, comment, approved_by: 'web-ui'}),
    });
    delete drafts[runId];
    toast(approved ? 'Approved' : 'Rejected');
  } catch (e) { toast('Error: ' + e.message); }
}

async function submitManualEdit(execId, runId, button) {
  if (button) button.disabled = true;
  const output = (document.getElementById('edit-' + runId) || {}).value || '';
  try {
    await api(`/executions/${encodeURIComponent(execId)}/manual-edit`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({run_id: runId, output, edited_by: 'web-ui'}),
    });
    delete drafts[runId];
    toast('Edit saved');
  } catch (e) { toast('Error: ' + e.message); if (button) button.disabled = false; }
}

async function cancelExec(id) {
  try { await api(`/executions/${encodeURIComponent(id)}/cancel`, {method: 'POST'}); toast('Canceled'); }
  catch (e) { toast('Error: ' + e.message); }
}

async function rerunExec(id, button) {
  if (button) button.disabled = true;
  try {
    const res = await api(`/executions/${encodeURIComponent(id)}/rerun`, {method: 'POST'});
    toast('Started ' + res.id);
    location.hash = '#/exec/' + encodeURIComponent(res.id);
  } catch (e) { toast('Error: ' + e.message); if (button) button.disabled = false; }
}

async function deleteExec(id, button) {
  if (!confirm(`Delete execution ${id}? This cannot be undone.`)) return;
  if (button) button.disabled = true;
  try {
    await api(`/executions/${encodeURIComponent(id)}`, {method: 'DELETE'});
    toast('Deleted');
    if (location.hash === '#/executions') route();
    else location.hash = '#/executions';
  } catch (e) { toast('Error: ' + e.message); if (button) button.disabled = false; }
}

// --- pipeline track diagram ---
// Lays a pipeline out from its entry: a chain of single handoffs is one line,
// orchestrator stages and multi-target handoffs become parallel tracks that
// rejoin (at the orchestrator's fan-in, at an agent several branches hand off
// to, or after the stage) before continuing.
const INK = '#151515';
const TRACK_COLOURS = [INK, '#2fb44a', '#f08a24', '#2f6fd0'];
const DIAGRAM_FONT = "'Arial Narrow','Helvetica Neue',Arial,sans-serif";
const D = {curve: 34, gap: 20, lead: 54, pad: 28, top: 92, rowGap: 6, cell: 22, platform: 18};
const measureCtx = document.createElement('canvas').getContext('2d');
function pipelineLineLabel(n) {
  return `→ ${n.pipeline || '?'}${n.from || n.until ? ` (${n.from || 'entry'}…${n.until || 'end'})` : ''}`;
}
let diagramSerial = 0;
function textWidth(text, font) { measureCtx.font = font; return measureCtx.measureText(text).width; }

function flowDiagram(p, execution = null) {
  const diagramID = `flow-${++diagramSerial}`;
  const byId = Object.fromEntries(p.nodes.map(n => [n.id, n]));
  const runStatusByNode = {};
  if (execution) for (const run of execution.runs || []) {
    const hasError = ['failed', 'waiting_retry', 'rejected'].includes(run.status) ||
      (run.error && !['canceled', 'interrupted'].includes(run.status));
    runStatusByNode[run.node_id] = hasError
      ? 'failed' : run.status;
  }
  const seen = new Set();
  const numbered = [];
  const LABEL = `600 11px ${DIAGRAM_FONT}`;
  const inbound = {};
  const routes = n => (n.handoff || []).map(route => typeof route === 'string' ? {to: route} : route);
  p.nodes.forEach(n => routes(n).forEach(route => { inbound[route.to] = (inbound[route.to] || 0) + 1; }));
  const isJoin = id => byId[id] && (byId[id].type === 'orchestrator' || inbound[id] > 1);

  // merge folds branches that stop at the same agent join into one track:
  // their own parallel tracks, then the shared agent's continuation.
  const merge = branches => {
    for (;;) {
      const i = branches.findIndex(b => b.join && byId[b.join].type !== 'orchestrator');
      if (i < 0) return branches;
      const j = branches[i].join;
      const group = branches.filter(b => b.join === j);
      const cont = chain(j, true);
      const head = group.length > 1 ? [{kind: 'par', tracks: group.map(b => b.seq)}] : group[0].seq.items;
      const merged = {seq: {kind: 'seq', items: [...head, ...cont.seq.items]}, join: cont.join};
      branches = branches.flatMap((b, k) => k === i ? [merged] : b.join === j ? [] : [b]);
    }
  };

  const chain = (id, inBranch, stopAtSeen = false) => {
    const items = [];
    let join = null;
    while (id) {
      const n = byId[id];
      if (n && seen.has(id) && stopAtSeen) { join = id; break; }
      if (!n || seen.has(id)) { items.push({kind: 'ref', id, missing: !n}); break; }
      seen.add(id);
      numbered.push(n);
      items.push({kind: 'node', n, num: numbered.length});
      // Session participants are drawn inside the session's interchange.
      (n.participants || []).forEach(pid => seen.add(pid));
      for (const st of n.stages || []) {
        const tracks = merge(st.agents.map(a => chain(a, true))).map(b => b.seq);
        // Each parallel group in a stage is drawn between a pair of platforms.
        tracks.forEach(t => t.items.forEach(item => { if (item.kind === 'par') item.platform = st.id; }));
        items.push({kind: 'par', label: st.id, tracks});
      }
      const next = routes(n);
      if (next.length === 0) break;
      if (next.length === 1) {
        if (stopAtSeen && seen.has(next[0].to)) { join = next[0].to; break; }
        if (inBranch && isJoin(next[0].to)) { join = next[0].to; break; }
        id = next[0].to;
        continue;
      }
      const raw = next.map(route => chain(route.to, true, stopAtSeen));
      const shared = [...new Set(raw.map(b => b.join))];
      // Every branch meets at one agent in this scope: draw it on this line.
      const branches = shared.length === 1 && shared[0] && byId[shared[0]].type !== 'orchestrator' ? raw : merge(raw);
      items.push({kind: 'par', tracks: branches.map(b => b.seq)});
      const joins = [...new Set(branches.map(b => b.join))];
      if (joins.length === 1 && joins[0]) {
        if (stopAtSeen && seen.has(joins[0])) { join = joins[0]; break; }
        if (inBranch && byId[joins[0]].type === 'orchestrator') { join = joins[0]; break; }
        id = joins[0];
        continue;
      }
      break;
    }
    return {seq: {kind: 'seq', items}, join};
  };

  // measure sets w (width) and up/down (extent above/below the line).
  const measure = it => {
    if (it.kind === 'node' || it.kind === 'ref') {
      const label = (it.kind === 'node' ? it.n.id : it.id).toUpperCase();
      it.tw = textWidth(label, LABEL);
      const type = it.kind === 'node' ? it.n.type : 'ref';
      if (type === 'orchestrator') { it.w = it.tw + 22; it.up = runStatusByNode[it.n.id] ? 28 : 13; it.down = 24; }
      else if (type === 'approval') { it.w = Math.max(40, it.tw); it.up = 40; it.down = 20; }
      else if (type === 'session') {
        const names = it.n.participants || [];
        it.pw = Math.max(0, ...names.map(name => textWidth(name, `400 9px ${DIAGRAM_FONT}`)));
        it.w = Math.max(names.length * 12 + 14, it.tw, it.pw + 4);
        it.up = 22; it.down = 30 + names.length * 10;
      }
      else if (type === 'pipeline') {
        it.pw = textWidth(pipelineLineLabel(it.n), `400 9px ${DIAGRAM_FONT}`);
        it.w = Math.max(50, it.tw, it.pw + 4); it.up = 22; it.down = 40;
      }
      else { it.w = Math.max(36, it.tw); it.up = 22; it.down = 20; }
    } else if (it.kind === 'seq') {
      it.items.forEach(measure);
      it.w = it.items.reduce((a, c) => a + c.w, 0) + D.gap * Math.max(0, it.items.length - 1);
      it.baseUp = Math.max(0, ...it.items.map(c => c.up));
      // Rejections that loop back along this line get lanes just above it.
      const localRejects = (it.localRejects || []).length;
      it.up = it.baseUp + (localRejects ? 10 + localRejects * 16 : 0);
      it.down = Math.max(0, ...it.items.map(c => c.down));
    } else {
      it.tracks.forEach(measure);
      it.inner = Math.max(...it.tracks.map(t => t.w)) + D.gap * 2;
      let y = 0;
      it.offsets = it.tracks.map((t, i) => {
        if (i > 0) y += it.tracks[i - 1].down + t.up + D.rowGap;
        return y;
      });
      const k = it.tracks.length;
      const mid = k % 2 ? it.offsets[(k - 1) / 2] : (it.offsets[k / 2 - 1] + it.offsets[k / 2]) / 2;
      it.offsets = it.offsets.map(o => o - mid);
      // All diverging tracks share one slope, so they peel off a common
      // diagonal like a ladder of points rather than fanning from one spot.
      const spread = Math.max(1, ...it.offsets.map(Math.abs));
      it.c = Math.max(D.curve, spread * 0.55);
      it.k = it.c / spread;
      it.w = it.inner + it.c * 2;
      it.up = Math.max(...it.tracks.map((t, i) => t.up - it.offsets[i])) + (it.label ? 22 : 0) + (it.platform ? D.platform : 0);
      it.down = Math.max(...it.tracks.map((t, i) => t.down + it.offsets[i])) + (it.platform ? D.platform : 0);
    }
  };

  const out = [];
  let platformCount = 0;
  const nodePositions = new Map();
  const text = (x, y, s, cls, anchor = 'start') =>
    out.push(`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`);
  const joint = (x, y) => out.push(`<path class="joint" d="M${x} ${y - 4}V${y + 4}" />`);

  const draw = (it, x, y, depth) => {
    const colour = TRACK_COLOURS[depth % TRACK_COLOURS.length];
    const width = depth === 0 ? 4 : 3.2;
    if (it.kind === 'seq') {
      it.lineY = y;
      let cx = x;
      it.items.forEach((c, i) => {
        if (c.kind !== 'par') out.push(`<path d="M${cx} ${y}H${cx + c.w}" stroke="${colour}" stroke-width="${width}" />`);
        draw(c, cx, y, depth);
        cx += c.w;
        if (i < it.items.length - 1) {
          out.push(`<path d="M${cx} ${y}H${cx + D.gap}" stroke="${colour}" stroke-width="${width}" />`);
          if (depth > 0) joint(cx + D.gap / 2, y);
          cx += D.gap;
        }
      });
      return;
    }
    if (it.kind === 'par') {
      const c = it.c, tc = TRACK_COLOURS[(depth + 1) % TRACK_COLOURS.length];
      const x2 = x + c + it.inner;
      it.tracks.forEach((t, i) => {
        const ty = y + it.offsets[i], dx = Math.abs(it.offsets[i]) * it.k;
        // Lead in and out only: the track's own contents draw the middle, so
        // nested loops are not overdrawn by a straight line.
        const sx = x + c + D.gap, ex = sx + t.w;
        out.push(`<path d="M${x} ${y}L${x + dx} ${ty}H${sx}M${ex} ${ty}H${x2 + c - dx}L${x2 + c} ${y}" stroke="${tc}" stroke-width="3.2" stroke-linejoin="round" fill="none" />`);
        joint(x + c + 4, ty); joint(x2 - 4, ty);
      });
      if (it.label) text(x + c + D.gap, y + it.offsets[0] - it.tracks[0].up - 12, it.label.toUpperCase().replace(/_/g, ' '), 'stage');
      if (it.platform) {
        const last = it.tracks.length - 1;
        const tops = [y + it.offsets[0] - it.tracks[0].up - D.platform, y + it.offsets[last] + it.tracks[last].down + 4];
        const name = it.platform.toUpperCase().replace(/_/g, ' ');
        tops.forEach((top, side) => {
          const number = ++platformCount, px = x + c, pw = it.inner, edgeY = side ? top : top + 14;
          out.push(`<g class="platform"><title>${esc(`Platform ${number}: stage ${it.platform}`)}</title>`,
            `<rect x="${px}" y="${top}" width="${pw}" height="14" class="platform-slab" />`,
            `<path d="M${px} ${edgeY}H${px + pw}" class="platform-edge" />`,
            `<rect x="${px}" y="${top}" width="18" height="14" class="platform-number" />`);
          text(px + 9, top + 10.5, number, 'platform-num', 'middle');
          text(px + 24, top + 10.5, name, 'platform-name');
          out.push('</g>');
        });
      }
      it.tracks.forEach((t, i) => draw(t, x + c + D.gap, y + it.offsets[i], depth + 1));
      return;
    }
    const n = it.n || {id: it.id, type: 'ref'};
    const label = n.id.toUpperCase();
    const mid = x + it.w / 2;
    if (n.type !== 'ref') {
      nodePositions.set(n.id, {
        x: mid + (n.type === 'approval' ? 9 : 0),
        y: y - (n.type === 'approval' ? 18 : 0),
        halfWidth: n.type === 'orchestrator' ? it.w / 2 : n.type === 'approval' ? 13 : n.type === 'session' ? ((n.participants || []).length * 12 + 10) / 2 : n.type === 'pipeline' ? 23 : 17,
        labelLeft: mid - it.tw / 2,
        labelRight: mid + it.tw / 2,
      });
    }
    const status = runStatusByNode[n.id] || '';
    const sessionTip = n.type === 'session'
      ? ` · participants: ${(n.participants || []).join(', ')} · ${n.turn_order === 'moderator' ? `moderated by ${n.moderator}` : 'round robin'} · up to ${n.max_rounds} rounds · ${n.consensus && n.consensus.method === 'moderator_decides' ? `${n.summary_agent} decides` : `consensus: ${(n.consensus && n.consensus.require) || 'all'} vote`}${n.chunks && n.chunks.enabled ? ' · chunks' : ''}`
      : n.type === 'pipeline'
        ? ` · runs pipeline ${n.pipeline}${n.from || n.until ? ` from ${n.from || 'its entry'} until ${n.until || 'the end'}` : ''}${n.params && Object.keys(n.params).length ? ' · params: ' + Object.keys(n.params).sort().map(k => `${k}=${n.params[k]}`).join(', ') : ''}`
        : '';            const contextTip = contextLabel(n.context) ? ' · ' + contextLabel(n.context) : '';
    const outputTip = n.output ? ' · ' + outputLabel(n.output) : '';
    const tip = n.type === 'ref' ? (it.missing ? `${n.id} (not defined)` : `continues at ${n.id}`) : `${it.num}. ${n.id} · ${n.type}${n.description ? ' — ' + n.description : ''}${sessionTip}${contextTip}${outputTip}${status ? ' · ' + status : ''}`;
    out.push(`<g class="node" data-node-id="${esc(n.id)}"><title>${esc(tip)}</title>`);
    if (n.type === 'orchestrator') {
      out.push(`<rect x="${x}" y="${y - 11}" width="${it.w}" height="22" fill="#c8732a" stroke="#7a3f12" stroke-width="1" />`);
      text(mid, status ? y - 16 : y + 4, label, status ? 'label' : 'block', 'middle');
      text(mid, y + 23, it.num, 'num', 'middle');
    } else if (n.type === 'approval') {
      const sx = mid - 4;
      out.push(`<path d="M${sx} ${y}V${y - 18}" stroke="${INK}" stroke-width="1.4" />`,
        `<path d="M${sx - 6} ${y - 18}H${sx}" stroke="${INK}" stroke-width="1.4" />`,
        `<rect x="${sx}" y="${y - 24}" width="26" height="12" rx="6" fill="#fff" stroke="${INK}" stroke-width="1.2" />`,
        `<circle cx="${sx + 6}" cy="${y - 18}" r="3.8" fill="#e3261b" />`,
        `<circle cx="${sx + 13}" cy="${y - 18}" r="3.2" fill="#fff" stroke="${INK}" stroke-width=".9" />`,
        `<circle cx="${sx + 20}" cy="${y - 18}" r="3.2" fill="#fff" stroke="${INK}" stroke-width=".9" />`);
      text(mid, y - 30, label, 'label', 'middle');
      text(mid, y + 19, it.num, 'num', 'middle');
    } else if (n.type === 'ref') {
      out.push(`<path d="M${x} ${y - 7}V${y + 7}" stroke="${INK}" stroke-width="2" stroke-dasharray="2 2" />`);
      text(x, y - 11, label + (it.missing ? '?' : ''), 'label ref');
    } else if (n.type === 'session') {
      // An interchange: one ring per participant inside a long station capsule.
      const names = n.participants || [];
      const capsule = names.length * 12 + 10;
      out.push(`<rect x="${mid - capsule / 2}" y="${y - 8}" width="${capsule}" height="16" rx="8" fill="#fff" stroke="${INK}" stroke-width="2.2" />`);
      names.forEach((_, i) => out.push(`<circle cx="${mid - capsule / 2 + 11 + i * 12}" cy="${y}" r="3.6" fill="#2f6fd0" stroke="${INK}" stroke-width=".8" />`));
      text(mid, y - 13, label, 'label', 'middle');
      text(mid, y + 21, it.num, 'num', 'middle');
      names.forEach((name, i) => text(mid, y + 33 + i * 10, name, 'participant', 'middle'));
    } else if (n.type === 'pipeline') {
      // An interchange with another line: an amber capsule with a spur
      // leaving it, labelled with the pipeline it runs.
      out.push(`<path d="M${mid + 10} ${y + 6}L${mid + 18} ${y + 14}H${mid + 26}" stroke="#d08a2f" stroke-width="3" fill="none" stroke-linecap="round" />`,
        `<rect x="${mid - 23}" y="${y - 7}" width="46" height="14" rx="7" fill="#f6d9a8" stroke="${INK}" stroke-width="2.2" />`,
        `<circle cx="${mid - 13}" cy="${y}" r="3.4" fill="#fff" stroke="${INK}" stroke-width="1.2" />`,
        `<circle cx="${mid + 13}" cy="${y}" r="3.4" fill="#d08a2f" stroke="${INK}" stroke-width="1.2" />`);
      text(mid, y - 12, label, 'label', 'middle');
      text(mid, y + 24, it.num, 'num', 'middle');
      text(mid, y + 35, pipelineLineLabel(n), 'participant', 'middle');
    } else {
      out.push(`<rect x="${mid - 17}" y="${y - 6.5}" width="34" height="13" rx="6.5" fill="${n.type === 'openspec' ? '#dceee9' : '#fff'}" stroke="${n.type === 'openspec' ? '#378b87' : INK}" stroke-width="2.2" />`);
      text(mid, y - 12, label, 'label', 'middle');
      text(mid, y + 19, it.num, 'num', 'middle');
    }
    if (status) {
      const lamp = n.type === 'approval' ? {x: mid + 9, y: y - 18} : {x: mid, y};
      out.push(`<circle class="run-lamp ${esc(status)}" cx="${lamp.x}" cy="${lamp.y}" r="3"><title>${esc(status)}</title></circle>`);
    }
    out.push('</g>');
  };

  const root = chain(p.entry, false).seq;
  const reworkBranches = [];
  for (let index = 0; index < numbered.length; index++) {
    const node = numbered[index];
    if (node.reject_to && !seen.has(node.reject_to)) {
      const branch = chain(node.reject_to, true, true);
      reworkBranches.push({from: node.id, seq: branch.seq, join: branch.join});
    }
  }
  const lineOf = new Map();
  const mapLines = seq => seq.items.forEach(item => {
    if (item.kind === 'node') lineOf.set(item.n.id, seq);
    else if (item.kind === 'par') item.tracks.forEach(mapLines);
  });
  mapLines(root);
  reworkBranches.forEach(branch => mapLines(branch.seq));
  const localReject = node => node.reject_to && lineOf.has(node.id) && lineOf.get(node.id) === lineOf.get(node.reject_to);
  p.nodes.filter(localReject).forEach(node => {
    const seq = lineOf.get(node.id);
    (seq.localRejects = seq.localRejects || []).push(node.id);
  });
  measure(root);
  reworkBranches.forEach(branch => measure(branch.seq));
  const x0 = D.pad + D.lead;
  const lineW = Math.ceil(x0 + Math.max(root.w, ...reworkBranches.map(branch => branch.seq.w)) + D.lead + D.pad);
  const stripW = numbered.length * D.cell;
  const width = Math.max(lineW, D.pad * 2 + 300 + stripW + 40);
  const rejectionCount = p.nodes.filter(node => node.reject_to && !localReject(node)).length;
  const rejectionLaneHeight = rejectionCount ? 28 + rejectionCount * 24 : 0;
  const reworkHeight = reworkBranches.reduce((total, branch) => total + branch.seq.up + branch.seq.down + 52, 0);
  const y = Math.ceil(D.top + rejectionLaneHeight + reworkHeight + root.up);

  out.push(`<path d="M${D.pad} ${y}H${x0}" stroke="${INK}" stroke-width="4" />`);
  out.push(`<path d="M${D.pad + 8} ${y + 14}h22m-6 -4l6 4l-6 4" stroke="${INK}" stroke-width="1.2" />`);
  draw(root, x0, y, 0);
  const xe = x0 + root.w;
  out.push(`<path d="M${xe} ${y}H${xe + D.lead - 14}" stroke="${INK}" stroke-width="4" />`,
    `<path d="M${xe + D.lead - 14} ${y - 9}V${y + 9}M${xe + D.lead - 14} ${y - 9}h-6M${xe + D.lead - 14} ${y + 9}h-6" stroke="${INK}" stroke-width="2.4" />`);

  let contentBottom = y + root.down;
  let reworkTop = D.top + rejectionLaneHeight;
  for (const branch of reworkBranches) {
    const source = nodePositions.get(branch.from);
    const branchX = Math.max(x0, Math.min((source?.x || x0) - branch.seq.w - D.gap, width - D.pad - branch.seq.w));
    const branchY = reworkTop + 24 + branch.seq.up;
    out.push(`<g class="rework-track" data-rework-for="${esc(branch.from)}">`);
    draw(branch.seq, branchX, branchY, 1);
    out.push('</g>');
    const join = nodePositions.get(branch.join);
    if (join) {
      const endX = branchX + branch.seq.w;
      const targetX = join.x + join.halfWidth + 3;
      const outerX = Math.max(endX, targetX) + 22;
      out.push(`<path class="return-route" d="M${endX} ${branchY}H${outerX}V${join.y}H${targetX}" marker-end="url(#${diagramID}-return)"><title>Return to ${esc(branch.join)}</title></path>`);
    }
    reworkTop = branchY + branch.seq.down + 28;
  }
  const rejectionRoutes = p.nodes.filter(node => node.reject_to && nodePositions.has(node.id) && nodePositions.has(node.reject_to));
  let topLane = 0;
  rejectionRoutes.forEach(node => {
    const source = nodePositions.get(node.id);
    const target = nodePositions.get(node.reject_to);
    const startX = source.x + source.halfWidth + 3;
    const endX = target.x - target.halfWidth - 3;
    const sourceSideX = Math.max(startX + 14, source.labelRight + 12);
    const targetSideX = Math.min(endX - 14, target.labelLeft - 12);
    let laneY;
    if (localReject(node)) {
      const seq = lineOf.get(node.id);
      laneY = seq.lineY - seq.baseUp - 10 - seq.localRejects.indexOf(node.id) * 16;
    } else {
      laneY = D.top + topLane++ * 24;
    }
    out.push(`<path class="reject-route" data-reject-from="${esc(node.id)}" data-reject-to="${esc(node.reject_to)}" d="M${startX} ${source.y}H${sourceSideX}V${laneY}H${targetSideX}V${target.y}H${endX}" marker-end="url(#${diagramID}-reject)"><title>On rejection: ${esc(node.id)} to ${esc(node.reject_to)}</title></path>`);
    text((startX + endX) / 2, laneY - 5, 'REJECT', 'rejection-note', 'middle');
  });

  // Notes and the numbered strip along the bottom.
  const stages = p.nodes.reduce((a, n) => a + (n.stages || []).length, 0);
  const approvals = p.nodes.filter(n => n.type === 'approval').map(n => n.id);
  const unreached = p.nodes.filter(n => !seen.has(n.id));
  const notes = [
    `${p.nodes.length} agent${p.nodes.length === 1 ? '' : 's'}${stages ? `, ${stages} stage${stages === 1 ? '' : 's'}` : ''}`,
    `entry: ${p.entry}`,
    approvals.length ? `approval: ${approvals.join(', ')}` : 'no approval gates',
  ];
  const base = Math.ceil(contentBottom + 34);
  notes.forEach((t, i) => text(D.pad, base + 12 + i * 13, t.toUpperCase(), 'note'));
  const sx = width - D.pad - stripW;
  numbered.forEach((n, i) => {
    const cx = sx + i * D.cell;
    out.push(`<g><title>${esc(`${i + 1}. ${n.id}`)}</title><rect x="${cx}" y="${base}" width="${D.cell}" height="30" class="cell" />` +
      `<path d="M${cx} ${base + 15}h${D.cell}" class="cell-rule" />` +
      `<text x="${cx + D.cell / 2}" y="${base + 11}" class="cell-num" text-anchor="middle">${i + 1}</text>` +
      `<text x="${cx + D.cell / 2}" y="${base + 26}" class="cell-type" text-anchor="middle">${esc(n.type[0].toUpperCase())}</text></g>`);
  });
  const height = base + Math.max(30, notes.length * 13 + 4) + 22;

  const words = p.name.split(/[^A-Za-z0-9]+/).filter(Boolean);
  const code = (words.length === 1 && words[0].length <= 3 ? words[0] : words.map(w => w[0]).join('').slice(0, 3)).toUpperCase();
  const tx = D.pad + Math.max(160, textWidth(p.name.toUpperCase(), `300 26px ${DIAGRAM_FONT}`) + 20) / 2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(p.name)} pipeline diagram">
    <defs>
      <marker id="${diagramID}-reject" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" style="fill:#c62828" /></marker>
      <marker id="${diagramID}-return" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" style="fill:${INK}" /></marker>
    </defs>
    <style>
      path { fill: none; }
      text { font: 600 11px ${DIAGRAM_FONT}; fill: ${INK}; }
      .title { font-size: 26px; font-weight: 300; letter-spacing: 1px; }
      .code { font-size: 13px; font-weight: 400; }
      .stage { font-size: 10.5px; letter-spacing: 1.2px; fill: #555; }
      .platform-slab { fill: #b5703f; stroke: #6e3d1c; stroke-width: 1; }
      .platform-edge { stroke: #f2c200; stroke-width: 2; }
      .platform-number { fill: #1d3f7a; stroke: #6e3d1c; stroke-width: 1; }
      .platform-num { font-size: 9px; fill: #fff; }
      .platform-name { font-size: 8.5px; letter-spacing: 1px; fill: #fff; }
      .num { font-size: 10px; font-weight: 400; fill: #444; }
      .participant { font-size: 9px; font-weight: 400; fill: #2f6fd0; }
      .block { fill: #fff; text-anchor: middle; }

      .cell-num, .cell-type { font: 400 9.5px Arial, sans-serif; }
      .node:hover .label { fill: #2f6fd0; }
    </style>

    (unreached.length ? `<div class="muted flow-note">Not reachable from ${esc(p.entry)}: ${unreached.map(n => esc(n.id)).join(', ')}</div>` : '');

async function showSettings() {
  setNav('settings');
  $main.innerHTML = '<h2>Settings</h2><div role="status" class="muted">Loading...</div>';
  try {
    if (!settingsDocument) {
      settingsDocument = await api('/settings', {cache: 'no-store'});
      settingsDraft = settingsDocument.content;
    }
  } catch (error) {
    $main.innerHTML = `<h2>Settings</h2><div class="err-banner" role="alert">${esc(error.message)}</div>`;
    return;
  }
  if (location.hash !== '#/settings') return;
  $main.innerHTML = `
    <h2>Settings</h2>
    <div class="settings-toolbar">
      <button id="settings-save" type="button">Save</button>
      <button id="settings-reload" type="button" class="secondary">Reload</button>
      <span id="settings-status" role="status" class="muted"></span>
    </div>
    <label for="settings-yaml">signalbox.yaml</label>
    <textarea id="settings-yaml" class="settings-editor" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
    <div id="settings-error" class="err-banner settings-error" role="alert" hidden></div>`;
  const editor = document.getElementById('settings-yaml');
  const save = document.getElementById('settings-save');
  const reload = document.getElementById('settings-reload');
  const status = document.getElementById('settings-status');
  const errorBanner = document.getElementById('settings-error');
  editor.value = settingsDraft;
  let busy = false;
  const update = () => {
    const dirty = settingsDraft !== settingsDocument.content;
    save.disabled = busy || !dirty;
    reload.disabled = busy;
    editor.disabled = busy;
    status.textContent = busy ? 'Saving...' : dirty ? 'Unsaved changes' : 'No unsaved changes';
  };
  editor.addEventListener('input', () => {
    settingsDraft = editor.value;
    errorBanner.hidden = true;
    update();
  });
  editor.addEventListener('keydown', event => {
    if (event.key === 'Tab' && !event.shiftKey) {
      event.preventDefault();
      editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end');
      editor.dispatchEvent(new Event('input', {bubbles: true}));
    }
  });
  save.addEventListener('click', async () => {
    busy = true;
    errorBanner.hidden = true;
    update();
    try {
      settingsDocument = await api('/settings', {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: settingsDraft, version: settingsDocument.version}),
      });
      settingsDraft = settingsDocument.content;
      busy = false;
      update();
      status.textContent = 'Saved. Restart the server to apply settings.';
    } catch (error) {
      busy = false;
      update();
      errorBanner.textContent = error.message;
      errorBanner.hidden = false;
    }
  });
  reload.addEventListener('click', async () => {
    if (settingsDraft !== settingsDocument.content && !confirm('Discard unsaved settings changes?')) return;
    reload.disabled = true;
    try {
      const document = await api('/settings', {cache: 'no-store'});
      settingsDocument = document;
      settingsDraft = document.content;
      await showSettings();
    } catch (error) {
      reload.disabled = false;
      errorBanner.textContent = error.message;
      errorBanner.hidden = false;
    }
  });
  update();
}

async function showWatchers() {
  setNav('watchers');
  $main.innerHTML = '<h2>Watchers</h2><div role="status" class="muted">Loading...</div>';
  try {
    if (!watcherDraft) watcherDocument = await api('/watchers', {cache: 'no-store'});
  } catch (error) {
    if (location.hash === '#/watchers') $main.innerHTML = `<h2>Watchers</h2><div class="err-banner" role="alert">${esc(error.message)}</div>`;
    return;
  }
  if (location.hash !== '#/watchers') return;
  $main.innerHTML = `<div class="topline"><div><h2>Watchers</h2>
    <div class="page-sub">Configure command pollers. Saved changes require a server restart; this page does not show live status.</div></div>
    <div><button id="watcher-reload" type="button" class="secondary">Reload</button>
    <button id="watcher-new" type="button">New watcher</button></div></div>
    <div id="watcher-error" class="err-banner settings-error" role="alert" hidden></div>
    <div id="watcher-status" role="status" class="muted"></div>
    <div id="watcher-list"></div><div id="watcher-editor"></div>`;
  const errorBanner = document.getElementById('watcher-error');
  const status = document.getElementById('watcher-status');
  const list = document.getElementById('watcher-list');
  const editor = document.getElementById('watcher-editor');
  const showError = error => { errorBanner.textContent = error.message; errorBanner.hidden = false; };
  const discard = () => !watcherDraft || confirm('Discard the unsaved watcher draft?');
  const render = () => {
    list.innerHTML = watcherDocument.watchers.length ? watcherDocument.watchers.map((w, i) => `
      <div class="card"><div class="topline"><div><b>${esc(w.name)}</b>
        <div class="muted">Pipeline: ${esc(w.pipeline)} · Interval: ${esc(w.interval)} · Timeout: ${w.timeout_seconds ? esc(w.timeout_seconds) + 's' : '2m (default)'}</div>
        <div class="mono">${esc(w.command)} ${esc((w.args || []).map(arg => JSON.stringify(arg)).join(' '))}</div></div>
        <div><button class="secondary sm" data-edit="${i}" type="button">Edit</button>
        <button class="danger sm" data-delete="${i}" type="button">Delete</button></div></div></div>`).join('') :
      '<div class="card muted">No watchers configured.</div>';
    editor.innerHTML = watcherDraft ? `<form id="watcher-form" class="card">
      <h3>${watcherDraftIndex < 0 ? 'New watcher' : 'Edit watcher'}</h3>
      <label for="watcher-name">Name</label><input id="watcher-name" required>
      <label for="watcher-command">Command</label><input id="watcher-command" required>
      <label for="watcher-args">Arguments (JSON array of strings)</label><textarea id="watcher-args" spellcheck="false"></textarea>
      <label for="watcher-interval">Interval (for example 30s or 5m)</label><input id="watcher-interval" required>
      <label for="watcher-timeout">Timeout in seconds (0 uses the two-minute default)</label><input id="watcher-timeout" type="number" min="0" step="1" required>
      <label for="watcher-pipeline">Pipeline name</label><input id="watcher-pipeline" required>
      <div class="settings-toolbar"><button type="submit">Save watcher</button><button id="watcher-cancel" class="secondary" type="button">Cancel</button></div>
      </form>` : '';
    list.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => {
      if (!discard()) return;
      watcherDraftIndex = Number(button.dataset.edit);
      const w = watcherDocument.watchers[watcherDraftIndex];
      watcherDraft = {...w, argsText: JSON.stringify(w.args || [], null, 2), timeoutText: String(w.timeout_seconds)};
      errorBanner.hidden = true; render();
    }));
    list.querySelectorAll('[data-delete]').forEach(button => button.addEventListener('click', async () => {
      if (!discard()) return;
      const index = Number(button.dataset.delete);
      if (!confirm(`Delete watcher "${watcherDocument.watchers[index].name}"?`)) return;
      const watchers = watcherDocument.watchers.filter((_, i) => i !== index);
      await saveWatchers(watchers);
    }));
    if (!watcherDraft) return;
    const form = document.getElementById('watcher-form');
    const fields = {name: 'watcher-name', command: 'watcher-command', argsText: 'watcher-args', interval: 'watcher-interval', timeoutText: 'watcher-timeout', pipeline: 'watcher-pipeline'};
    Object.entries(fields).forEach(([name, id]) => {
      const input = document.getElementById(id);
      input.value = watcherDraft[name];
      input.addEventListener('input', () => { watcherDraft[name] = input.value; });
    });
    document.getElementById('watcher-cancel').addEventListener('click', () => {
      if (!discard()) return;
      watcherDraft = null; errorBanner.hidden = true; render();
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      try {
        const args = JSON.parse(watcherDraft.argsText);
        if (!Array.isArray(args) || args.some(arg => typeof arg !== 'string')) throw new Error('Arguments must be a JSON array of strings.');
        const timeout = Number(watcherDraft.timeoutText);
        if (!Number.isSafeInteger(timeout) || timeout < 0) throw new Error('Timeout must be a non-negative integer.');
        const {argsText, timeoutText, ...entry} = watcherDraft;
        entry.args = args; entry.timeout_seconds = timeout;
        const watchers = watcherDocument.watchers.slice();
        if (watcherDraftIndex < 0) watchers.push(entry); else watchers[watcherDraftIndex] = entry;
        await saveWatchers(watchers);
      } catch (error) { showError(error); }
    });
  };
  const saveWatchers = async watchers => {
    errorBanner.hidden = true;
    $main.querySelectorAll('button, input, textarea').forEach(el => { el.disabled = true; });
    try {
      watcherDocument = await api('/watchers', {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({version: watcherDocument.version, watchers}),
      });
      watcherDraft = null;
      if (settingsDocument && settingsDraft === settingsDocument.content) { settingsDocument = null; settingsDraft = null; }
      if (location.hash === '#/watchers') { render(); status.textContent = 'Saved. Restart the server to apply watcher changes.'; }
    } catch (error) { if (location.hash === '#/watchers') showError(error); }
    finally { if (location.hash === '#/watchers') $main.querySelectorAll('button, input, textarea').forEach(el => { el.disabled = false; }); }
  };
  document.getElementById('watcher-new').addEventListener('click', () => {
    if (!discard()) return;
    watcherDraftIndex = -1;
    watcherDraft = {original_name: '', name: '', command: '', argsText: '[]', interval: '5m', timeoutText: '0', pipeline: ''};
    errorBanner.hidden = true; render();
  });
  document.getElementById('watcher-reload').addEventListener('click', async () => {
    if (!discard()) return;
    try {
      const document = await api('/watchers', {cache: 'no-store'});
      watcherDraft = null;
      watcherDocument = document;
      if (location.hash === '#/watchers') { errorBanner.hidden = true; status.textContent = 'Reloaded from disk.'; render(); }
    } catch (error) { if (location.hash === '#/watchers') showError(error); }
  });
  render();
}

async function showPipelineEditor(filename, creating) {
  setNav('pipelines');
  const expectedHash = location.hash;
  $main.innerHTML = '<h2>Pipeline editor</h2><div class="muted" role="status">Loading...</div>';
  let files, draft;
  try {
    files = await api('/pipeline-files', {cache: 'no-store'});
    if (!creating && !filename) {
      filename = files[0]?.filename || '';
      creating = !filename;
    }
    const key = creating ? '__new__' : filename;
    draft = pipelineDrafts.get(key);
    if (!draft) {
      const document = creating ? {content: pipelineTemplate, version: ''} :
        await api('/pipeline-files/' + encodeURIComponent(filename), {cache: 'no-store'});
      draft = {filename: creating ? '' : filename, savedFilename: creating ? '' : filename,
        content: document.content, savedContent: document.content, version: document.version, isNew: creating, notice: ''};
      pipelineDrafts.set(key, draft);
    }
  } catch (error) {
    if (location.hash === expectedHash) $main.innerHTML = `<h2>Pipeline editor</h2><div class="err-banner" role="alert">${esc(error.message)}</div><button class="secondary" onclick="location.hash='#/pipelines'">Pipelines</button>`;
    return;
  }
  if (location.hash !== expectedHash) return;
  renderPipelineMenu(files.filter(file => file.name).sort((a, b) => a.name.localeCompare(b.name)), null);
  $main.innerHTML = `
    <div class="topline"><h2>${draft.isNew ? 'New pipeline' : 'Edit pipeline'}</h2>
      <button class="secondary" onclick="location.hash='#/pipelines'">Pipelines</button></div>
    <label for="pipeline-file">Pipeline file</label>
    <select id="pipeline-file"><option value="">New pipeline</option>${files.map(file => `<option value="${esc(file.filename)}">${esc(file.filename)}</option>`).join('')}</select>
    <div class="settings-toolbar">
      <button id="pipeline-save" type="button">Save</button>
      <button id="pipeline-reload" type="button" class="secondary">${draft.isNew ? 'Reset' : 'Reload'}</button>
      <span id="pipeline-status" role="status" class="muted"></span>
    </div>
    <label for="pipeline-filename">Filename</label>
    <input id="pipeline-filename" type="text" placeholder="my-pipeline.yaml" autocomplete="off" ${draft.isNew ? '' : 'readonly'}>
    <label for="pipeline-yaml">Pipeline YAML</label>
    <textarea id="pipeline-yaml" class="settings-editor" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
    <div id="pipeline-error" class="err-banner settings-error" role="alert" hidden></div>`;
  const chooser = document.getElementById('pipeline-file');
  const filenameInput = document.getElementById('pipeline-filename');
  const editor = document.getElementById('pipeline-yaml');
  const save = document.getElementById('pipeline-save');
  const reload = document.getElementById('pipeline-reload');
  const status = document.getElementById('pipeline-status');
  const errorBanner = document.getElementById('pipeline-error');
  chooser.value = draft.isNew ? '' : draft.filename;
  filenameInput.value = draft.filename;
  editor.value = draft.content;
  let busy = '';
  const update = () => {
    const dirty = pipelineDraftChanged(draft);
    save.disabled = !!busy || !draft.filename.trim() || (!draft.isNew && !dirty);
    chooser.disabled = reload.disabled = editor.disabled = filenameInput.disabled = !!busy;
    status.textContent = busy || (dirty ? 'Unsaved changes' : draft.notice || 'No unsaved changes');
  };
  const capture = () => {
    draft.content = editor.value;
    draft.filename = filenameInput.value;
    draft.notice = '';
    errorBanner.hidden = true;
    update();
  };
  filenameInput.addEventListener('input', capture);
  editor.addEventListener('input', capture);
  editor.addEventListener('keydown', event => {
    if (event.key === 'Tab' && !event.shiftKey) {
      event.preventDefault();
      editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end');
      editor.dispatchEvent(new Event('input', {bubbles: true}));
    }
  });
  chooser.addEventListener('change', () => {
    location.hash = chooser.value ? '#/pipelines/edit/' + encodeURIComponent(chooser.value) : '#/pipelines/new';
  });
  save.addEventListener('click', async () => {
    busy = 'Saving...';
    errorBanner.hidden = true;
    update();
    try {
      const saved = await api('/pipeline-files/' + encodeURIComponent(draft.filename), {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: draft.content, version: draft.version}),
      });
      if (draft.isNew) pipelineDrafts.delete('__new__');
      draft.version = saved.version;
      draft.content = draft.savedContent = saved.content;
      draft.savedFilename = draft.filename;
      draft.isNew = false;
      draft.notice = 'Saved. Available for new runs.';
      pipelineDrafts.set(draft.filename, draft);
      if (location.hash === expectedHash) {
        history.replaceState(null, '', '#/pipelines/edit/' + encodeURIComponent(draft.filename));
        await showPipelineEditor(draft.filename, false);
      }
    } catch (error) {
      busy = '';
      update();
      errorBanner.textContent = error.message;
      errorBanner.hidden = false;
    }
  });
  reload.addEventListener('click', async () => {
    if (pipelineDraftChanged(draft) && !confirm('Discard unsaved pipeline changes?')) return;
    busy = 'Loading...';
    update();
    try {
      const document = draft.isNew ? {content: pipelineTemplate, version: ''} :
        await api('/pipeline-files/' + encodeURIComponent(draft.filename), {cache: 'no-store'});
      draft.content = draft.savedContent = document.content;
      draft.version = document.version;
      if (draft.isNew) draft.filename = draft.savedFilename = '';
      draft.notice = '';
      if (location.hash === expectedHash) await showPipelineEditor(draft.filename, draft.isNew);
    } catch (error) {
      busy = '';
      update();
      errorBanner.textContent = error.message;
      errorBanner.hidden = false;
    }
  });
  update();
}

      <div id="pl-info" class="muted" style="margin-top:8px"></div>
      <div id="pl-params"></div>
      <label for="input">Input</label><textarea id="input" aria-describedby="input-requirements input-error" placeholder="The task, question, or payload handed to the entry agent..."></textarea>
      <div id="input-requirements" class="muted"></div>
      <div id="input-error" class="err-banner" role="alert" hidden></div>
      <label>Files <span class="muted">optional</span></label>
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Attach files">
        <div>Drop files here or <u>browse</u></div>
        <div class="muted" id="files-hint">${limits.max_files ? `Up to ${limits.max_files} files, ${fmtBytes(limits.max_bytes)} each${limits.allowed_extensions && limits.allowed_extensions.length ? ' · ' + limits.allowed_extensions.map(esc).join(' ') : ''}` : ''}</div>
        <input id="file-input" type="file" multiple hidden>
      </div>
      <div id="file-list"></div>
      <div style="margin-top:16px"><button id="start">Start execution</button></div>
    </div>`;
  const info = document.getElementById('pl-info');
  const paramsBox = document.getElementById('pl-params');
  const sel = document.getElementById('pl');
  const inputField = document.getElementById('input');
  const inputError = document.getElementById('input-error');
  const inputRequirements = document.getElementById('input-requirements');
  let inputValidationAttempted = false;
  const validateInput = () => {
    const p = pipelines.find(q => q.name === sel.value);
    const message = structuredInputError(inputField.value, p && p.input_schema);
    inputError.textContent = message;
    inputError.hidden = !message;
    inputField.setAttribute('aria-invalid', String(Boolean(message)));
    return !message;
  };
  inputField.addEventListener('input', () => {
    if (inputValidationAttempted) validateInput();
  });
  const requestedPipeline = new URLSearchParams(location.hash.split('?')[1] || '').get('pipeline');
  if (pipelines.some(p => p.name === requestedPipeline)) sel.value = requestedPipeline;
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const fileList = document.getElementById('file-list');
  let attached = [];
  const showFiles = () => {
    fileList.innerHTML = attached.map((f, i) => `<div class="file-chip"><span class="mono">${esc(f.name)}</span> <span class="muted">${fmtBytes(f.size)}</span><button class="secondary sm" data-remove="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('');
  };
  const addFiles = list => {
    for (const f of list) {
      if (limits.max_bytes && f.size > limits.max_bytes) { toast(`${f.name} is larger than ${fmtBytes(limits.max_bytes)}`); continue; }
      attached = attached.filter(a => a.name !== f.name).concat(f);
    }
    showFiles();
  };
  fileList.addEventListener('click', e => {
    const i = e.target.dataset && e.target.dataset.remove;
    if (i !== undefined) { attached.splice(Number(i), 1); showFiles(); }
  });
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('over'); addFiles(e.dataTransfer.files); });
  const describe = () => {
    const p = pipelines.find(q => q.name === sel.value);
    inputRequirements.textContent = p && p.input_schema
      ? `Required: valid JSON matching schema "${p.input_schema}".`
      : '';
    inputField.placeholder = p && p.input_schema
      ? 'Enter a JSON document matching the required input schema...'
      : 'The task, question, or payload handed to the entry agent...';
    inputValidationAttempted = false;
    inputError.hidden = true;
    inputError.textContent = '';
    inputField.removeAttribute('aria-invalid');
    paramsBox.innerHTML = p && p.params && p.params.length
      ? `<div class="params-form"><div class="params-title">Parameters</div>${p.params.map(paramField).join('')}</div>` : '';
    if (!p) { info.textContent = ''; return; }
    info.innerHTML = `${p.description ? esc(p.description) + '<br>' : ''}
      ${p.input_schema ? `<div class="muted">Input must be a JSON document matching schema <span class="mono">${esc(p.input_schema)}</span> (see <a href="#/schemas">Schemas</a>).</div>` : ''}
      ${p.files ? `<div class="muted">${esc(filesSpecLabel(p.files))}</div>` : ''}
      <div style="margin-top:6px">${flowDiagram(p)}</div>`;
  };
  sel.addEventListener('change', describe); describe();
  document.getElementById('start').addEventListener('click', async () => {
    inputValidationAttempted = true;
    if (!validateInput()) { inputField.focus(); return; }
    const input = document.getElementById('input').value.trim();
    const params = {};
    for (const el of paramsBox.querySelectorAll('[data-param]')) {
      if (el.value !== '') params[el.dataset.param] = el.value;
    }
    let files = attached.slice();
    for (const el of paramsBox.querySelectorAll('[data-param-file]')) {
      const f = el.files && el.files[0];
      if (!f) continue;
      params[el.dataset.paramFile] = f.name;
      files = files.filter(a => a.name !== f.name);
      files.push(f);
    }
    if (!input && !files.length) { toast('Please provide an input or attach a file.'); return; }
    try {
      let opts;
      if (files.length) {
        const form = new FormData();
        form.append('pipeline', sel.value);
        form.append('input', input);
        form.append('params', JSON.stringify(params));
        files.forEach(f => form.append('file', f, f.name));
        opts = {method: 'POST', body: form};
      } else {
        opts = {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pipeline: sel.value, input, params})};
      }
      const res = await api('/executions', opts);
      location.hash = '#/exec/' + encodeURIComponent(res.id);
    } catch (e) { toast('Error: ' + e.message); }
  });
}

// --- pipelines ---
function structuredInputError(input, schema) {
  if (!schema) return '';
  if (!input.trim()) return `Input is required: enter a JSON document matching schema "${schema}".`;
  try {
    JSON.parse(input);
    return '';
  } catch {
    return `Input must be valid JSON matching schema "${schema}". Plain text is not valid JSON.`;
  }
}

function pipelineLink(name) {
  return '#/pipelines/view/' + encodeURIComponent(name);
}
async function downloadPipelinePython(button) {
  const errorBox = document.getElementById('pipeline-export-error');
  errorBox.hidden = true;
  button.disabled = true;
  button.textContent = 'Exporting...';
  try {
    const name = button.dataset.exportPipeline;
    const response = await fetch('/api/pipelines/' + encodeURIComponent(name) + '/export?format=python', {cache: 'no-store'});
    if (!response.ok) {
      const body = await response.json();
      throw new Error(body.error || response.statusText);
    }
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement('a');
    link.href = url;
    link.download = name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_') + '.py';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Python export downloaded');
  } catch (error) {
    errorBox.textContent = 'Export failed: ' + error.message;
    errorBox.hidden = false;
  } finally {
    button.disabled = false;
    button.textContent = 'Export Python';
  }
}

  const publishButton = $main.querySelector('#publish-button');
  if (publishButton) publishButton.addEventListener('click', async () => {
    publishButton.disabled = true;
    try {
      const m = await api('/registry/publish', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({[isPlugin ? 'plugin' : isKnowledge ? 'knowledge_base' : 'pipeline']: $main.querySelector('#publish-pipeline').value,
          description: isKnowledge ? $main.querySelector('#publish-description').value.trim() : '',
          version: $main.querySelector('#publish-version').value.trim(), by: 'web-ui'})});
      toast(`Published ${m.name}@${m.version}`);
      location.hash = registryLink(kind, m.name + '@' + m.version);
    } catch (e) { toast('Error: ' + e.message); publishButton.disabled = false; }
  });
  if (selected) renderRegistryPackage(selected, installed, kind);
}

async function renderRegistryPackage(ref, installed, kind) {
  const [name, version] = ref.split('@');
  const panel = document.getElementById('registry-detail');
  let d;
  try { d = await api(`/registry/${encodeURIComponent(name)}/${encodeURIComponent(version || 'latest')}`, {cache: 'no-store'}); }
  catch (e) { panel.innerHTML = `<div class="err-banner">${esc(e.message)}</div>`; return; }
  if (document.getElementById('registry-detail') !== panel) return;
  const m = d.manifest;
  if ((m.kind || 'pipeline') !== kind) {
    panel.innerHTML = `<div class="err-banner" role="alert">This package belongs in the other registry tab.</div>`;
    return;
  }
  const isKnowledge = kind === 'knowledge';
  const isPlugin = kind === 'plugin';
  const current = installed[m.name];
  const files = m.files.map(f => `<details data-key="pkg:${esc(f.path)}" ${f.path === m.entry ? 'open' : ''}>
      <summary><span class="mono">${esc(f.path)}</span> <span class="muted">${f.size} bytes · sha256 ${esc(f.sha256.slice(0, 12))}…</span></summary>
      <pre class="out">${esc(d.files[f.path] ?? '(unavailable)')}</pre></details>`).join('');
  panel.innerHTML = `<div class="card">
    <div class="topline"><div><h3 style="margin:0">${esc(m.name)}</h3>${m.description ? `<div class="muted">${esc(m.description)}</div>` : ''}</div>
    <select id="pkg-version" style="width:auto">${d.versions.map(v => `<option ${v === m.version ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
    ${d.verify_error ? `<div class="err-banner" style="margin-top:10px">Integrity check failed: ${esc(d.verify_error)}</div>` : ''}
    <dl class="pkg-meta">
      <dt>Published</dt><dd>${fmtTime(m.published_at)}${m.published_by ? ' by ' + esc(m.published_by) : ''}</dd>
      <dt>Digest</dt><dd class="mono">${esc(m.digest)}</dd>
      <dt>Type</dt><dd>${isPlugin ? 'Plugin' : isKnowledge ? 'Knowledge base' : 'Pipeline'}</dd>
      ${kind === 'pipeline' ? `<dt>Schema</dt><dd>${m.schema_version}</dd>
      <dt>Runtimes</dt><dd>${(m.runtimes || []).map(r => `<span class="mono">${esc(r)}</span>`).join(', ') || '—'}</dd>` : ''}
      ${m.params && m.params.length ? `<dt>Params</dt><dd>${m.params.map(esc).join(', ')}</dd>` : ''}
      <dt>Installed</dt><dd>${current ? `${esc(current.version)}${current.digest === m.digest ? ' (this version)' : ''}` : 'no'}</dd>
    </dl>
    <div class="approve-actions">
      <button id="install-button" ${d.verify_error ? 'disabled' : ''}>${current ? (current.digest === m.digest ? 'Reinstall' : 'Install ' + esc(m.version)) : 'Install'}</button>
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="install-force" style="width:auto"> overwrite local changes</label>
    </div>
    <div class="muted" style="font-size:12.5px">Install is pinned to the digest above and verifies every file.${isPlugin ? ` Files install into plugins/${esc(m.name)}/. Use type: plugin:${esc(m.name)}. Review all code before running: plugins execute as your user, not in a sandbox. Install never executes code or installs dependencies.` : isKnowledge ? ` Documents are installed into knowledge-bases/${esc(m.name)}/ and can then be attached to workflow agents with knowledge_bases: [${esc(m.name)}].` : ' The pipeline is validated against this project\'s runtimes before writing anything. Bundled plugins run as your user; review their code before execution.'}</div>
    <h4>Files</h4>${files}</div>`;
  panel.querySelector('#pkg-version').addEventListener('change', event => {
    location.hash = registryLink(kind, m.name + '@' + event.target.value);
  });
  const button = panel.querySelector('#install-button');
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      const res = await api('/registry/install', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ref: m.name + '@' + m.version, digest: m.digest, force: panel.querySelector('#install-force').checked})});
      const changed = (res.written || []).length + (res.replaced || []).length;
      toast(`Installed ${m.name}@${m.version} · ${changed} file${changed === 1 ? '' : 's'} written${(res.removed || []).length ? ` · ${res.removed.length} obsolete plugin files removed` : ''}`);
      route();
    } catch (e) { toast('Error: ' + e.message); button.disabled = false; }
  });
}

api('/meta').then(m => { document.getElementById('project-name').textContent = m.project; }).catch(() => {});
route();
</script>
</body>
</html>
